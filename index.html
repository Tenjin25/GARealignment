<!DOCTYPE html>
<html>
<head>
	<meta charset='utf-8'>
	<title>GA Political Realignment Map (2008-2024)</title>
	<meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no'>
	<link href='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css' rel='stylesheet'>
	<script src='https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js'></script>
	<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
	<style>
		/* --- Paste all your CSS styles here --- */
		html, body {
			height: 100vh;
			margin: 0;
			padding: 0;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			overflow: hidden;
		}
		#map {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
		}
		.main-controls {
			position: absolute;
			top: 20px;
			left: 20px;
			background: rgba(255, 255, 255, 0.95);
			backdrop-filter: blur(10px);
			padding: 20px;
			border-radius: 12px;
			box-shadow: 0 8px 32px rgba(0,0,0,0.1);
			z-index: 1000;
			min-width: 380px;
		}
		.main-controls.minimized {
			min-width: 60px;
			padding: 15px;
		}
		.main-controls.minimized .controls-content {
			display: none;
		}
		.controls-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 15px;
		}
		.minimize-btn {
			background: #e5e7eb;
			border: none;
			border-radius: 6px;
			width: 30px;
			height: 30px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			font-size: 18px;
		}
		.sidebar {
			position: fixed;
			top: 0;
			right: 0;
			width: 420px;
			height: 100vh;
			background: #fff;
			box-shadow: -2px 0 10px rgba(0,0,0,0.1);
			overflow-y: auto;
			z-index: 1001;
			transition: transform 0.3s ease-in-out;
			transform: translateX(100%); /* Start minimized */
		}
		.sidebar:not(.minimized) {
			transform: translateX(0);
		}
		/* (Add all your other CSS rules here) */
	</style>
</head>
<body>

	<div id="map">
		</div>

	<div class="main-controls" id="main-controls">
		<div class="controls-header">
			<h3>🗳️ GA Political Contests</h3>
			<button class="minimize-btn" onclick="toggleMainControls()">−</button>
		</div>
		<div class="controls-content">
			<div class="control-group">
				<label>📊 Contest Type:</label>
				<select id="contest">
					</select>
			</div>
			<button onclick="applyCategories()" class="btn-primary">🎨 Apply Political Categories</button>
			<button onclick="resetView()" class="btn-secondary">🔄 Reset View</button>
			<button onclick="toggleLabels()" class="btn-success">🏷️ Toggle County Labels</button>
			<div class="control-group" style="margin-top: 15px;">
				<label>🔄 Compare Contests (Swing Arrows):</label>
				<div style="display: flex; gap: 5px;">
					<select id="swing-year1" style="width: 50%;"></select>
					<select id="swing-year2" style="width: 50%;"></select>
				</div>
				<div style="display: flex; gap: 5px; margin-top: 5px;">
					<select id="swing-contest1" style="width: 50%;"></select>
					<select id="swing-contest2" style="width: 50%;"></select>
				</div>
				<button onclick="drawAllCountySwingArrows()" class="btn-secondary">Show Swing Arrows</button>
				<button onclick="clearSwingArrows()" class="btn-secondary">Clear Arrows</button>
			</div>
		</div>
	</div>

	<button id="sidebar-float-toggle" style="position:fixed;top:20px;right:20px;z-index:1001;width:56px;height:56px;background:#2563eb;color:#fff;border:none;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.15);font-size:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;">+</button>
	<div class="sidebar minimized" id="sidebar">
		<div class="sidebar-header">
			<h3>📊 County Analysis</h3>
			<button class="minimize-btn" onclick="toggleSidebar()">+</button>
		</div>
		<div class="sidebar-content">
			<div class="county-details" id="county-details" style="display: none;">
				<h4 id="county-name">Select a County</h4>
				<div id="county-info-content">Click on any county to see detailed results.</div>
			</div>
			<div style="margin-bottom: 16px;">
				<label for="county-search" style="font-weight:600;">Search County:</label>
				<input type="text" id="county-search" placeholder="Type to search..." style="width:100%;padding:8px;border-radius:6px;margin-top:6px;margin-bottom:6px;" />
			</div>
			<div class="statewide-results" id="statewide-results">
				<h4>🏛️ Georgia Statewide</h4>
				<div id="statewide-content"><p>Select a contest to see statewide results.</p></div>
			</div>
			<div class="findings-section">
				<h4>🔍 Research Findings</h4>
				</div>
		</div>
	</div>

	<div class="legend" id="legend">
		</div>

	<script>
		"use strict";

		// --- Global Variables ---
		let countiesGeojson = null;
		let electionData = null;
		let swingArrowsActive = false;
		let swingCanvas, swingCtx;

		// --- Mapbox Initialization (Done only ONCE) ---
		mapboxgl.accessToken = 'pk.eyJ1Ijoic2hhbWFyZGF2aXMiLCJhIjoiY21kcW8yeDB2MDhvbTJzb29qeGp1aDZmZCJ9.Zw_i6U-dL7_bEKRHTUh7yg';
		const map = new mapboxgl.Map({
			container: 'map',
			style: 'mapbox://styles/mapbox/light-v11',
			center: [-83.5, 32.9],
			zoom: 6.5
		});

		// --- Main Application Entry Point ---
		map.on('load', init);

		async function init() {
			try {
				console.log('Loading map data...');
				const [geojson, results] = await Promise.all([
					fetch('./data/Georgia_Counties.geojson').then(r => r.json()),
					fetch('./data/results_by_year_grouped.json').then(r => r.json())
				]);

				countiesGeojson = geojson;
				electionData = results;
				console.log('Data loaded successfully.');

				// Setup map sources and layers
				map.addSource('counties', { type: 'geojson', data: countiesGeojson });
				map.addLayer({ id: 'county-fill', type: 'fill', source: 'counties', paint: { 'fill-color': '#888', 'fill-opacity': 0.3 }});
				map.addLayer({ id: 'county-outline', type: 'line', source: 'counties', paint: { 'line-color': '#222', 'line-width': 1 }});

				// Create and setup the Swing Canvas now that the map is ready
				setupSwingCanvas();

				// Populate UI elements now that data is loaded
				populateContestDropdown();
				populateSwingDropdowns();
				
				// Setup all event listeners
				setupEventListeners();
				
			} catch (error) {
				console.error('Initialization failed:', error);
				alert('Error: Could not load map data.');
			}
		}

		function setupEventListeners() {
			document.getElementById('county-search').addEventListener('keydown', e => {
				if (e.key === 'Enter') {
					const val = e.target.value.trim();
					if (val) zoomToCounty(val);
				}
			});
			
			document.getElementById('contest').addEventListener('change', updateStatewideResults);
			
			map.on('click', 'county-fill', (e) => {
				if (e.features.length > 0) {
					const countyName = e.features[0].properties.Label || e.features[0].properties.NAME;
					if (countyName) {
						// The click handler now reuses the corrected zoomToCounty logic
						zoomToCounty(countyName); 
					}
				}
			});

			map.on('mouseenter', 'county-fill', () => map.getCanvas().style.cursor = 'pointer');
			map.on('mouseleave', 'county-fill', () => map.getCanvas().style.cursor = '');
			map.on('move', () => {
				if (swingArrowsActive) drawAllCountySwingArrows();
			});

			document.getElementById('sidebar-float-toggle').addEventListener('click', toggleSidebar);
		}

		// --- Helper Functions ---

		function toTitleCase(str) {
			if (!str) return '';
			return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
		}

		function populateContestDropdown() {
			const contestSelect = document.getElementById('contest');
			const fragment = document.createDocumentFragment();
			fragment.appendChild(new Option('Select a Contest...', ''));

			const contestMap = new Map();
			for (const [year, contests] of Object.entries(electionData.results_by_year)) {
				for (const [contestKey, contestData] of Object.entries(contests)) {
					const label = `${contestData.contest_label || toTitleCase(contestKey.replace(/_/g, ' '))} (${year})`;
					const value = `${year}|${contestKey}`;
					if (!contestMap.has(label)) {
						contestMap.set(label, value);
						fragment.appendChild(new Option(label, value));
					}
				}
			}
			contestSelect.innerHTML = '';
			contestSelect.appendChild(fragment);
		}
		
		function populateSwingDropdowns() {
			const swingYear1 = document.getElementById('swing-year1');
			const swingYear2 = document.getElementById('swing-year2');
			const years = Object.keys(electionData.results_by_year).sort((a, b) => b - a);
			
			years.forEach(y => {
				swingYear1.add(new Option(y, y));
				swingYear2.add(new Option(y, y));
			});

			const populateContestSelect = (year, contestSelect) => {
				contestSelect.innerHTML = '';
				if (year && electionData.results_by_year[year]) {
					for (const [contestKey, data] of Object.entries(electionData.results_by_year[year])) {
						const label = data.contest_label || toTitleCase(contestKey.replace(/_/g, ' '));
						contestSelect.add(new Option(label, contestKey));
					}
				}
			};

			swingYear1.addEventListener('change', () => populateContestSelect(swingYear1.value, document.getElementById('swing-contest1')));
			swingYear2.addEventListener('change', () => populateContestSelect(swingYear2.value, document.getElementById('swing-contest2')));
			
			if (years.length > 1) {
				swingYear1.value = years[1];
				swingYear2.value = years[0];
				populateContestSelect(swingYear1.value, document.getElementById('swing-contest1'));
				populateContestSelect(swingYear2.value, document.getElementById('swing-contest2'));
			}
		}

		function categoryColorForMargin(marginPct, winner) {
			if (marginPct >= 40) return winner === 'R' ? '#67000d' : '#08306b';
			if (marginPct >= 30) return winner === 'R' ? '#a50f15' : '#08519c';
			if (marginPct >= 20) return winner === 'R' ? '#cb181d' : '#3182bd';
			if (marginPct >= 10) return winner === 'R' ? '#ef3b2c' : '#6baed6';
			if (marginPct >= 5.5) return winner === 'R' ? '#fb6a4a' : '#9ecae1';
			if (marginPct >= 1) return winner === 'R' ? '#fcae91' : '#c6dbef';
			if (marginPct >= 0.5) return winner === 'R' ? '#fee8c8' : '#e1f5fe';
			return '#f7f7f7';
		}
		
		// --- UI Interaction Functions (Made global for onclick attributes) ---

		window.toggleSidebar = function() {
			const sidebar = document.getElementById('sidebar');
			const floatBtn = document.getElementById('sidebar-float-toggle');
			sidebar.classList.toggle('minimized');
			const isMinimized = sidebar.classList.contains('minimized');
			sidebar.querySelector('.minimize-btn').textContent = isMinimized ? '−' : '+'; // Corrected logic
			floatBtn.style.display = isMinimized ? 'flex' : 'none';
		};

		window.toggleMainControls = function() {
			const controls = document.getElementById('main-controls');
			const isMinimized = controls.classList.toggle('minimized');
			controls.querySelector('.minimize-btn').textContent = isMinimized ? '+' : '−';
		};

		window.resetView = function() {
			map.flyTo({ center: [-83.5, 32.9], zoom: 6.5 });
			map.setPaintProperty('county-fill', 'fill-color', '#888');
		};

		window.toggleLabels = function() {
			if (!map.getLayer('county-labels')) {
				map.addLayer({
					id: 'county-labels',
					type: 'symbol',
					source: 'counties',
					layout: { 'text-field': ['get', 'Label'], 'text-font': ['Open Sans Bold', 'Arial Unicode MS Bold'], 'text-size': 13, 'visibility': 'none' },
					paint: {'text-color': '#111', 'text-halo-color': 'white', 'text-halo-width': 1.5}
				});
			}
			const visibility = map.getLayoutProperty('county-labels', 'visibility');
			map.setLayoutProperty('county-labels', 'visibility', visibility === 'visible' ? 'none' : 'visible');
		};

		window.applyCategories = function() {
			const contestVal = document.getElementById('contest').value;
			if (!contestVal) return alert('Please select a contest.');

			const [year, contestKey] = contestVal.split('|');
			const contestObj = electionData.results_by_year?.[year]?.[contestKey];
			if (!contestObj?.results) return;

			const matchExpr = ['match', ['downcase', ['get', 'Label']]];
			for (const [county, result] of Object.entries(contestObj.results)) {
				const totalVotes = result.total_votes || 0;
				if (totalVotes === 0) continue;

				const marginPct = ((result.dem_votes || 0) - (result.rep_votes || 0)) / totalVotes * 100;
				const winner = marginPct > 0 ? 'D' : 'R';
				const color = categoryColorForMargin(Math.abs(marginPct), winner);
				matchExpr.push(county.toLowerCase(), color);
			}
			matchExpr.push('#888'); // Default color

			map.setPaintProperty('county-fill', 'fill-color', matchExpr);
			updateStatewideResults();
		};
		
		function updateStatewideResults() {
			const statewideContent = document.getElementById('statewide-content');
			const contestVal = document.getElementById('contest').value;
			if (!contestVal) {
				statewideContent.innerHTML = `<p>Select a contest to see statewide results.</p>`;
				return;
			}
			
			const [year, contestKey] = contestVal.split('|');
			const contestObj = electionData.results_by_year?.[year]?.[contestKey];
			if (!contestObj?.results) return;

			let totalDem = 0, totalRep = 0, totalVotes = 0;
			for(const result of Object.values(contestObj.results)) {
				totalDem += result.dem_votes || 0;
				totalRep += result.rep_votes || 0;
				totalVotes += result.total_votes || 0;
			}
			
			if (totalVotes === 0) return;
			
			const winnerAbbr = totalDem > totalRep ? 'D' : 'R';
			const margin = (totalDem - totalRep) / totalVotes * 100;
			const marginStr = `${winnerAbbr}+${Math.abs(margin).toFixed(2)}%`;
			
			statewideContent.innerHTML = `
				<b>Total Votes:</b> ${totalVotes.toLocaleString()}<br>
				<b>Margin:</b> ${marginStr}
			`;
		}

		// --- THE FULLY CORRECTED zoomToCounty AND CLICK HANDLER LOGIC ---
		window.zoomToCounty = function(countyName) {
			if (!countiesGeojson) return alert('County data not loaded');

			const feature = countiesGeojson.features.find(f => {
				const props = f.properties;
				const keys = ['NAME', 'NAME10', 'County', 'COUNTY', 'COUNTY_NAM', 'Label'];
				return keys.some(k => props[k] && props[k].toString().toLowerCase() === countyName.toLowerCase());
			});

			if (!feature) return alert(`County "${countyName}" not found`);

			map.fitBounds(turf.bbox(feature), { padding: 40, maxZoom: 10 });
			
			const sidebar = document.getElementById('sidebar');
			if (sidebar.classList.contains('minimized')) {
				toggleSidebar();
			}

			const countyLabel = feature.properties.Label || feature.properties.NAME || '';
			document.getElementById('county-details').style.display = 'block';
			document.getElementById('county-name').textContent = toTitleCase(countyLabel) + ' County';

			let infoHtml = 'Select a contest from the dropdown to see results.';
			const contestVal = document.getElementById('contest').value;

			if (contestVal && contestVal.includes('|')) {
				const [year, contestKey] = contestVal.split('|');
				const contestObj = electionData.results_by_year?.[year]?.[contestKey];
				const result = contestObj?.results?.[countyLabel.toLowerCase()];

				if (result) {
					const r = result;
					const demVotes = r.dem_votes || 0;
					const repVotes = r.rep_votes || 0;
					const totalVotes = r.total_votes || 0;
					const winnerAbbr = (demVotes > repVotes) ? 'D' : 'R';
					const margin = totalVotes ? ((demVotes - repVotes) / totalVotes * 100) : 0;
					const marginStr = `${winnerAbbr}+${Math.abs(margin).toFixed(2)}%`;
					const marginColor = (winnerAbbr === 'D') ? '#2563eb' : '#cb181d';
					const demPct = totalVotes ? (demVotes / totalVotes * 100).toFixed(2) : '0.00';
					const repPct = totalVotes ? (repVotes / totalVotes * 100).toFixed(2) : '0.00';
					
					infoHtml = `
						<b>Total Votes:</b> ${totalVotes.toLocaleString()}<hr>
						<b>Margin:</b> <span style='color:${marginColor};font-weight:bold;'>${marginStr}</span><hr>
						<b>Vote Breakdown:</b><br>
						<span style='color:#2563eb;font-weight:bold;'>${r.dem_candidate || 'Democrat'} (D)</span>: ${demPct}% (${demVotes.toLocaleString()})<br>
						<span style='color:#cb181d;font-weight:bold;'>${r.rep_candidate || 'Republican'} (R)</span>: ${repPct}% (${repVotes.toLocaleString()})`;
				} else {
					infoHtml = `No results found for ${countyLabel} County in this contest.`;
				}
			}
			document.getElementById('county-info-content').innerHTML = infoHtml;
		};

		// --- Swing Arrows Functions ---
		
		function setupSwingCanvas() {
			swingCanvas = document.createElement('canvas');
			swingCanvas.id = 'swingCanvas';
			swingCanvas.style.position = 'absolute';
			swingCanvas.style.top = '0';
			swingCanvas.style.left = '0';
			swingCanvas.style.width = '100%';
			swingCanvas.style.height = '100%';
			swingCanvas.style.pointerEvents = 'none';
			swingCanvas.style.zIndex = '10';
			map.getContainer().appendChild(swingCanvas);
			swingCtx = swingCanvas.getContext('2d');
			
			const resize = () => {
				swingCanvas.width = map.getCanvas().clientWidth;
				swingCanvas.height = map.getCanvas().clientHeight;
			};
			
			map.on('resize', resize);
			resize();
		}
		
		window.drawAllCountySwingArrows = function() {
			if (!countiesGeojson || !electionData || !swingCanvas) return;

			const y1 = document.getElementById('swing-year1').value;
			const c1 = document.getElementById('swing-contest1').value;
			const y2 = document.getElementById('swing-year2').value;
			const c2 = document.getElementById('swing-contest2').value;

			if (!y1 || !c1 || !y2 || !c2) {
				return alert('Please select two years and two contests to compare.');
			}

			const results1 = electionData.results_by_year?.[y1]?.[c1]?.results;
			const results2 = electionData.results_by_year?.[y2]?.[c2]?.results;

			if (!results1 || !results2) {
				return alert('Could not find election data for one or both selections.');
			}
			
			swingCtx.clearRect(0, 0, swingCanvas.width, swingCanvas.height);

			countiesGeojson.features.forEach(feature => {
				const countyName = (feature.properties.Label || '').toLowerCase();
				const res1 = results1[countyName];
				const res2 = results2[countyName];

				if (!res1 || !res2 || !res1.total_votes || !res2.total_votes) return;

				const margin1 = ((res1.dem_votes - res1.rep_votes) / res1.total_votes) * 100;
				const margin2 = ((res2.dem_votes - res2.rep_votes) / res2.total_votes) * 100;
				const swing = margin2 - margin1;

				if (isNaN(swing)) return;

				const color = swing > 0 ? '#2563eb' : '#cb181d';
				const length = Math.min(50, Math.max(8, Math.abs(swing) * 1.5));
				const centroid = turf.centroid(feature).geometry.coordinates;
				const pixel = map.project(centroid);

				swingCtx.save();
				swingCtx.translate(pixel.x, pixel.y);
				swingCtx.rotate(swing > 0 ? -Math.PI / 2 : Math.PI / 2);
				swingCtx.strokeStyle = color;
				swingCtx.lineWidth = 3;
				swingCtx.beginPath();
				swingCtx.moveTo(0, 0);
				swingCtx.lineTo(0, -length);
				swingCtx.stroke();
				// Arrowhead
				swingCtx.beginPath();
				swingCtx.moveTo(0, -length);
				swingCtx.lineTo(-4, -length + 8);
				swingCtx.moveTo(0, -length);
				swingCtx.lineTo(4, -length + 8);
				swingCtx.stroke();
				swingCtx.restore();
			});
			swingArrowsActive = true;
		}
		
		window.clearSwingArrows = function() {
			if(swingCtx) swingCtx.clearRect(0, 0, swingCanvas.width, swingCanvas.height);
			swingArrowsActive = false;
		};

	</script>
</body>
</html>
